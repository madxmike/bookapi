version: 1
system: bookapi

scope:
  decisions:
    - id: D1
      decision: The canonical identifier is ISBN-13.
      rationale: One row per book; ISBN-10 input is normalized to its 978 form.
    - id: D2
      decision: PUT and DELETE are the write verbs; PUT upserts, DELETE removes.
      rationale: A natural key makes both writes idempotent; create-only semantics are not required yet.
    - id: D3
      decision: The database primary key enforces uniqueness.
      rationale: One constraint replaces application-level concurrency reasoning.
    - id: D4
      decision: Updates are last-write-wins.
      rationale: Conditional writes are out of scope for this version.
    - id: D5
      decision: 400 for bad input, 404 for missing, 503 when the database is unavailable, 500 only for bugs.
      rationale: The error surface is part of the contract and is testable.
    - id: D6
      decision: Error bodies are {"error":{"code","message"}} and never contain driver or SQL text.
      rationale: Internal disclosure is the most common leak in generated handlers.
    - id: D7
      decision: /healthz is liveness; /readyz checks the database.
      rationale: A liveness check that fails during a database outage causes restarts that make the incident worse.
    - id: D8
      decision: Only 978 and 979 are accepted as ISBN-13 prefixes.
      rationale: 977 is a valid EAN prefix for periodicals but is not an ISBN.
    - id: D9
      decision: DELETE returns 204 No Content whether or not the row existed; a valid but absent ISBN is success, not 404.
      rationale: The property requires a repeated DELETE to succeed, and a response that depends on prior existence cannot be idempotent.
    - id: D10
      decision: DELETE resolves the path ISBN through isbn.Canonical before touching storage; an invalid ISBN is 400 invalid_isbn and no row is touched.
      rationale: Identity is shared by GET, PUT, and DELETE; otherwise the ISBN-10 and ISBN-13 forms of one book could behave differently.
    - id: D11
      decision: DELETE does not read or validate a request body; the 1 MiB limit applies to PUT, the only verb whose contract accepts a body.
      rationale: Parsing a body on DELETE adds a failure mode with no semantic value and would let a valid delete fail for an empty reason.
    - id: D12
      decision: The module has no directory named internal; every package is importable at a stable path.
      rationale: The restriction is structural and deterministic, so it is enforced by a test rather than by review.

properties:
  - id: isbn.canonical
    kind: primitive
    scope: repo
    locus: code
    polarity: require
    statement: Any valid ISBN-10 or ISBN-13 maps to exactly one ISBN-13, and an invalid check digit is rejected.
    witness: Two rows whose ISBNs differ only by 10/13 form, or a 2xx for an invalid check digit.
    check: {kind: test, command: go test ./internal/isbn/...}
    evidence: tested
    assumes: []

  - id: book.persisted
    kind: primitive
    scope: repo
    locus: code
    polarity: require
    statement: A book written through the API is readable after the process restarts and from a second instance.
    witness: A GET returns 404 after a restart for a book that previously returned 200.
    check: {kind: test, command: go test ./internal/store/... (BOOKAPI_TEST_DSN set)}
    evidence: tested
    assumes:
      - postgres_enforces_primary_key_under_concurrency

  - id: write.idempotent
    kind: primitive
    scope: repo
    locus: code
    polarity: require
    statement: Repeating a PUT with the same ISBN yields the same stored record and one row.
    witness: Two rows after two identical PUTs, or a changed record after an identical PUT.
    check: {kind: test, command: go test ./internal/store/... (BOOKAPI_TEST_DSN set)}
    evidence: tested
    assumes: []

  - id: write.no_duplicate_under_concurrency
    kind: primitive
    scope: repo
    locus: code
    polarity: forbid
    statement: Concurrent PUTs of one ISBN never produce more than one row.
    witness: COUNT(*) > 1 after concurrent writes.
    check: {kind: test, command: go test ./internal/store/... -run Concurrent (BOOKAPI_TEST_DSN set)}
    evidence: tested
    assumes:
      - postgres_enforces_primary_key_under_concurrency

  - id: api.read_shape
    kind: primitive
    scope: repo
    locus: code
    polarity: require
    statement: GET returns 200 with the stored fields, 404 with code not_found when absent, and 400 with code invalid_isbn on a bad check digit.
    witness: A 200 for a missing book, a 404 for a stored book, or a 400 body without a code.
    check: {kind: test, command: go test ./internal/httpapi/...}
    evidence: tested
    assumes: []

  - id: api.error_shape
    kind: primitive
    scope: repo
    locus: code
    polarity: forbid
    statement: No error response contains driver text, SQL, a stack trace, or a file path.
    witness: A response body containing "pq:" or "SQLSTATE".
    check: {kind: test, command: go test ./internal/httpapi/...}
    evidence: tested
    assumes: []

  - id: api.survives_db_outage
    kind: primitive
    scope: repo
    locus: code
    polarity: require
    statement: When the database is unreachable, requests return 503 within 2s and /healthz still returns 200.
    witness: A 500 or a hang during a database outage, or /healthz failing.
    check: {kind: test, command: go test ./internal/httpapi/...}
    evidence: tested
    assumes: []

  - id: ops.liveness_vs_readiness
    kind: primitive
    scope: repo
    locus: code
    polarity: require
    statement: /readyz reports failure when the database is unreachable; /healthz does not.
    witness: Both endpoints returning the same status during an outage.
    check: {kind: test, command: go test ./cmd/api/...}
    evidence: tested
    assumes: []

  - id: api.body_limit
    kind: primitive
    scope: repo
    locus: code
    polarity: require
    statement: A request body larger than 1 MiB is rejected with 413.
    witness: A 2 MiB body accepted with 200 or 201.
    check: {kind: test, command: go test ./internal/httpapi/...}
    evidence: tested
    assumes: []

  - id: book.delete_effective_and_idempotent
    kind: primitive
    scope: repo
    locus: code
    polarity: require
    statement: A DELETE of a valid ISBN returns 204 and leaves no row, a second DELETE of the same ISBN also returns 204, and a subsequent GET returns 404.
    witness: A 404 from a DELETE of a valid absent ISBN, a row still present after a 204 DELETE, or a 200 from GET after a successful DELETE.
    check: {kind: test, command: go test ./internal/store/... ./internal/httpapi/... (BOOKAPI_TEST_DSN set)}
    evidence: assumed
    # Unit tests cover the handler contract against a fake. The DB-backed tests
    # skip without BOOKAPI_TEST_DSN, so four of five cheats are rejected and
    # 002 (Delete returns ErrNotFound on zero rows) is not. Run the integration
    # suite to promote this to tested.
    assumes:
      - postgres_delete_where_missing_commits_successfully
    conflicts:
      - id: D2
        resolution: D2 amended to name DELETE as a second write verb.
      - id: D5
        resolution: 404-for-missing applies to reads. DELETE is defined by effect, so a valid absent ISBN returns 204; GET keeps 404.
  - id: code.no_internal_package
    kind: primitive
    scope: repo
    locus: code
    polarity: forbid
    statement: The module contains no directory named internal, at any depth.
    witness: A directory named internal exists anywhere outside .git.
    check: {kind: test, command: go test ./cmd/api -run TestNoInternalPackage}
    evidence: tested
    assumes: []

non_goals:
  - authentication
  - multi-tenancy
  - search and pagination
  - caching
  - rate limiting
  - conditional writes (ETag / If-Match)
  - soft delete, tombstones, and restore/undelete
  - deletion audit log or history
  - cascade deletion of related records
  - authorization for destructive operations
  - bulk or collection deletion (`DELETE /books`)
